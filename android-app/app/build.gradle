apply plugin: 'com.android.application'

// Endpoints are public routing information, not credentials. Configure them
// explicitly per build type; never embed an expired or user-specific tunnel URL.
def configuredEndpoint = { String propertyName, String envName, String buildType ->
    def supplied = project.findProperty(propertyName)
    if (supplied == null) {
        supplied = System.getenv(envName)
    }
    String value = (supplied == null ? '' : supplied.toString()).trim()
    if (value.isEmpty()) {
        return ''
    }

    URI url
    try {
        url = new URI(value)
    } catch (java.net.URISyntaxException ex) {
        throw new GradleException("${propertyName}: invalid OCR URL")
    }

    String scheme = url.scheme == null ? '' : url.scheme.toLowerCase(java.util.Locale.ROOT)
    boolean permitted = scheme == 'https' || (buildType == 'debug' && scheme == 'http')
    if (!permitted || url.host == null || url.host.isEmpty()
            || url.rawUserInfo != null || url.rawQuery != null || url.rawFragment != null
            || (url.rawPath != null && url.rawPath != '' && url.rawPath != '/')
            || !value.endsWith('/')) {
        throw new GradleException("${propertyName}: use a valid ${buildType == 'release' ? 'HTTPS' : 'HTTP(S)'} server root URL ending in /, without credentials, path, query or fragment")
    }
    return value
}

def debugOcrUrl = configuredEndpoint('ocrDebugBaseUrl', 'OCR_DEBUG_BASE_URL', 'debug')
def releaseOcrUrl = configuredEndpoint('ocrReleaseBaseUrl', 'OCR_RELEASE_BASE_URL', 'release')

android {
    namespace "com.nkm.ar.core.java.views.helloar"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.nkm.ar.core.java.helloar"

        // AR Optional apps must declare minSdkVersion >= 14.
        // AR Required apps must declare minSdkVersion >= 24.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'OCR_BASE_URL', groovy.json.JsonOutput.toJson(debugOcrUrl)
        }
        release {
            // Release builds never accept an HTTP endpoint.
            buildConfigField 'String', 'OCR_BASE_URL', groovy.json.JsonOutput.toJson(releaseOcrUrl)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ARCore (Google Play Services for AR) library.
    implementation 'com.google.ar:core:1.50.0'

    // Obj - a simple Wavefront OBJ file loader
    // https://github.com/javagl/Obj
    implementation 'de.javagl:obj:0.4.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Network body logging is deliberately disabled.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
