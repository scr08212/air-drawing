name: Inspect thesis handwriting images

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-paper-figures.yml"
      - "python-backend/tests/extract_paper_figures.py"
      - "python-backend/tests/validate_paper_hello.py"
      - "논문_*.pdf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF figure inspection dependency
        run: python -m pip install "PyMuPDF==1.26.6"
      - name: Extract paper figures and page renderings
        run: python python-backend/tests/extract_paper_figures.py
      - name: Install pinned PaddleOCR CPU stack
        run: |
          python -m pip install --no-cache-dir \
            "paddlepaddle==3.1.0" \
            "paddleocr==3.1.0" \
            "paddlex==3.1.1" \
            "langchain==0.3.26" \
            "langchain-community==0.3.27" \
            "langchain-core==0.3.67" \
            "langchain-openai==0.3.27" \
            "numpy==2.2.6" \
            "pillow==11.2.1"
          python -m pip check
      - name: Run actual OCR on project-generated handwriting sample
        env:
          OCR_DEVICE: cpu
          OMP_NUM_THREADS: "1"
        run: python python-backend/tests/validate_paper_hello.py
      - name: Upload paper figure candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: capstone-paper-figures
          path: ci-paper-figures/
          if-no-files-found: error
          retention-days: 7
