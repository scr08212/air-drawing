name: Repeated real Flask OCR requests

on:
  pull_request:
    paths:
      - ".github/workflows/flask-repeated-real-ocr.yml"
      - "python-backend/server/**"
      - "python-backend/model/**"
      - "python-backend/tests/warmup_live_backend.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-real-ocr:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OCR_DEVICE: cpu
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned real OCR stack
        run: |
          python -m pip install --no-cache-dir \
            "Flask==3.1.1" \
            "pyngrok==7.2.9" \
            "paddlepaddle==3.1.0" \
            "paddleocr==3.1.0" \
            "paddlex==3.1.1" \
            "langchain==0.3.26" \
            "langchain-community==0.3.27" \
            "langchain-core==0.3.67" \
            "langchain-openai==0.3.27" \
            "numpy==2.2.6" \
            "pillow==11.2.1"
          python -m pip check
      - name: Test two HTTP requests against one real OCR server
        run: |
          python - <<'PY'
          import runpy
          runpy.run_path("python-backend/tests/smoke_real_paddleocr.py")["sample_png"]()
          PY
          python -u python-backend/server/app.py > ci-artifacts/flask-repeat.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python python-backend/tests/warmup_live_backend.py
      - name: Upload synthetic-only server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeated-real-ocr
          path: ci-artifacts/
          if-no-files-found: ignore
