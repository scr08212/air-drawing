name: Flask API tests

on:
  push:
    paths:
      - "python-backend/server/**"
      - "python-backend/model/**"
      - "python-backend/tests/**"
      - ".github/workflows/flask-api-tests.yml"
  pull_request:
    paths:
      - "python-backend/server/**"
      - "python-backend/model/**"
      - "python-backend/tests/**"
      - ".github/workflows/flask-api-tests.yml"

jobs:
  flask-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "Flask==3.1.1" "pytest>=8,<10" "pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Run Flask contract tests
        working-directory: python-backend
        run: python -m pytest -q tests/test_flask_api.py tests/test_paddleocr_security.py
