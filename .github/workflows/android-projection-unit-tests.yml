name: Android projection unit tests

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-projection-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-projection-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Run projector and renderer JVM unit tests
        run: |
          chmod +x android-app/gradlew
          ./android-app/gradlew --no-daemon -p android-app :app:testDebugUnitTest
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-projection-unit-tests
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
